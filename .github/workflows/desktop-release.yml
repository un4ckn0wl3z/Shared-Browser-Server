name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload the installers to this release tag (for example v1.0.4). Leave empty to only build."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: dist:win
            artifact: shared-browser-windows-x64
            # latest.yml and the blockmap let installed Windows clients auto-update from the release.
            files: |
              electron-client/dist/*.exe
              electron-client/dist/*.exe.blockmap
              electron-client/dist/latest.yml
          - name: macOS universal
            os: macos-15
            command: dist:mac
            artifact: shared-browser-macos-universal
            # The zip and latest-mac.yml let code-signed macOS builds update themselves.
            files: |
              electron-client/dist/*.dmg
              electron-client/dist/*.zip
              electron-client/dist/*.blockmap
              electron-client/dist/latest-mac.yml
          - name: Linux x64
            os: ubuntu-latest
            command: dist:linux
            artifact: shared-browser-linux-x64
            # latest-linux.yml lets the AppImage update itself.
            files: |
              electron-client/dist/*.AppImage
              electron-client/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript
        run: pnpm run check

      # Builds are signed only when the matching repository secrets exist; otherwise they stay unsigned.
      #   Windows: WIN_CSC_LINK (base64 .pfx or URL) and WIN_CSC_KEY_PASSWORD
      #   macOS:   MAC_CSC_LINK (base64 Developer ID .p12) and MAC_CSC_KEY_PASSWORD, plus APPLE_ID,
      #            APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for notarization
      - name: Package application
        shell: bash
        run: |
          extra=()
          # Only a signed macOS app can update itself, so the client is told at build time.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ]; then extra+=("-c.extraMetadata.signedBuild=true"); fi
          pnpm run ${{ matrix.command }} "${extra[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Release tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi
          # This job has no checkout, so every gh call needs --repo. A release created by hand on
          # GitHub (which also starts this workflow) is reused and only receives the installers.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shared Browser $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
