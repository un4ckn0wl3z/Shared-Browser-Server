name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload the installers to this release tag (for example v1.0.4). Leave empty to only build."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: dist:win
            artifact: shared-browser-windows-x64
            # latest.yml and the blockmap let installed Windows clients auto-update from the release.
            files: |
              electron-client/dist/*.exe
              electron-client/dist/*.exe.blockmap
              electron-client/dist/latest.yml
          - name: macOS universal
            os: macos-15
            command: dist:mac
            artifact: shared-browser-macos-universal
            files: electron-client/dist/*.dmg
          - name: Linux x64
            os: ubuntu-latest
            command: dist:linux
            artifact: shared-browser-linux-x64
            # latest-linux.yml lets the AppImage update itself.
            files: |
              electron-client/dist/*.AppImage
              electron-client/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript
        run: pnpm run check

      # electron-builder downloads Electron and its packaging tools (NSIS, 7-Zip, AppImage) from GitHub
      # releases. Caching them avoids most downloads, and retries ride out the occasional 502/504.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-downloads-${{ runner.os }}-${{ hashFiles('electron-client/pnpm-lock.yaml') }}
          restore-keys: electron-downloads-${{ runner.os }}-

      - name: Package application
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            rm -rf dist
            if pnpm run ${{ matrix.command }}; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Packaging attempt $attempt failed; retrying in $((attempt * 30)) seconds"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Packaging failed after 4 attempts"
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Release tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi
          # This job has no checkout, so every gh call needs --repo. A release created by hand on
          # GitHub (which also starts this workflow) is reused and only receives the installers.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shared Browser $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
